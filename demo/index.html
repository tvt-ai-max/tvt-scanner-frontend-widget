<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TVT Scanner Widget - Demo</title>
  <link rel="stylesheet" href="../src/widget.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f1f5f9;
      color: #0D0D1A;
      min-height: 100vh;
    }
    .demo-header {
      background: linear-gradient(135deg, #003189 0%, #001d52 100%);
      color: #fff;
      padding: 32px 24px;
      text-align: center;
    }
    .demo-header h1 { font-size: 28px; margin-bottom: 8px; }
    .demo-header p { opacity: 0.8; font-size: 14px; }
    .demo-controls {
      max-width: 680px;
      margin: 20px auto;
      padding: 0 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .demo-controls label {
      font-size: 14px;
      font-weight: 600;
      color: #003189;
    }
    .demo-controls select, .demo-controls input {
      padding: 8px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
    }
    .demo-controls button {
      padding: 8px 16px;
      background: #003189;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .demo-controls button:hover { background: #002570; }
    .demo-widget {
      max-width: 720px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .demo-footer {
      text-align: center;
      padding: 24px;
      font-size: 13px;
      color: #94a3b8;
    }
    .demo-footer a { color: #003189; }
  </style>
</head>
<body>
  <div class="demo-header">
    <h1>TVT Scanner Widget Demo</h1>
    <p>Interactive preview of the embeddable web audit scanner widget</p>
  </div>

  <div class="demo-controls">
    <label for="apiMode">API Mode:</label>
    <select id="apiMode">
      <option value="mock" selected>Mock Server (localhost:3000)</option>
      <option value="live">Live API</option>
    </select>
    <input type="text" id="liveApiUrl" placeholder="Live API URL" style="display:none;flex:1;" />
    <button id="reinitBtn">Re-initialize Widget</button>
  </div>

  <div class="demo-widget">
    <div id="tvt-scanner-demo"></div>
  </div>

  <div class="demo-footer">
    <p>TVT Scanner Widget v1.0.0 &middot; <a href="https://tvtagency.com" target="_blank" rel="noopener">TVT Agency</a></p>
  </div>

  <script src="../src/widget.js"></script>
  <script>
    (function () {
      var currentWidget = null;
      var modeSelect = document.getElementById('apiMode');
      var liveInput = document.getElementById('liveApiUrl');
      var reinitBtn = document.getElementById('reinitBtn');

      function getApiUrl() {
        return modeSelect.value === 'mock'
          ? 'http://localhost:3000'
          : liveInput.value.trim();
      }

      function initWidget() {
        if (currentWidget) currentWidget.destroy();
        currentWidget = TVTScanner.init({
          containerId: 'tvt-scanner-demo',
          apiUrl: getApiUrl(),
          zaloUrl: 'https://zalo.me/tvtagency'
        });
      }

      modeSelect.addEventListener('change', function () {
        liveInput.style.display = modeSelect.value === 'live' ? 'block' : 'none';
      });

      reinitBtn.addEventListener('click', initWidget);
      initWidget();
    })();
  </script>
</body>
</html>
